<head>

<style>
/* =========================================================
1. AQUÍ CAMBIAN LOS COLORES Y TAMAÑOS.
Conserven los nombres de las variables, los : y los ;.
   ========================================================= */
:root {
  --pagina: white;          /* Color general. */
  --texto: #202020;         /* Letras. */
  --botones: #dddddd;       /* Fondo de botones. */
--texto-boton: black;
  --panel: #fffffff2;       /* Fondo legible de tarjetas y bienvenida. */
--borde: #777777;
  --seleccion: #2462bc;     /* Contorno del avatar elegido. */
  --escenario: #eeeeee;    /* Fondo sin foto del colegio. */
--titulo-perder: #a01818;
  --tam-personaje: 110px;   /* AQUÍ cambian el tamaño del avatar en el recorrido. */
  --tam-puerta: 150px;       /* AQUÍ cambia tamaño de la puerta. */
  --tam-reto: 26px;        /* AQUÍ cambian tamaño de las preguntas. */
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--texto); font-family: Arial,sans-serif; }
[hidden] { display: none !important; }
button, input { font: inherit; }
button { background: var(--botones); color: var(--texto-boton); border: 1px solid var(--borde); padding: 11px 17px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--seleccion); outline-offset: 3px; }
.pantalla { position: relative; height: 100dvh; overflow: auto; background-position: center; background-size: cover; }
.centrada { display: grid; place-items: center; padding: 20px; }
.panel { width: min(900px,100%); padding: 25px; background: var(--panel); border: 1px solid var(--borde); }
h1 { font-size: clamp(34px,6vw,60px); margin: 0 0 15px; }
h2 { font-size: 28px; }
p,li { font-size: 17px; line-height: 1.5; }
.acciones { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
/* PORTADA A PANTALLA COMPLETA, SIN FRANJAS NI RECORTES.
   fill ajusta el ancho y el alto a la ventana; cambia ligeramente las proporciones.
   Los botones quedan sobre el suelo, debajo de los personajes. */
#portada { position: relative; text-align: center; background-color: #1da5ed; display: grid; place-items: center; padding: 0; height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }
#fotoPortada { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: fill; }
#portada .panel { position: absolute; z-index: 1; bottom: max(12px,env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); margin: 0; padding: 10px 14px; }
#portada .acciones { margin: 0; gap: 8px; }
#portada button { padding: 10px 14px; font-size: clamp(13px,2vw,17px); }
#portada.con-imagen .textoPortada { display: none; }
#fotoInstrucciones { display: block; width: 100%; max-height: 40vh; object-fit: contain; }
#avatares { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.opcionAvatar { min-width: 0; display: grid; place-items: center; gap: 10px; background: var(--panel); border: 3px solid var(--borde); }
.opcionAvatar[aria-pressed="true"] { border-color: var(--seleccion); outline: 2px solid var(--seleccion); }
.opcionAvatar img { width: 100%; height: 150px; object-fit: contain; }
.opcionAvatar .ejemplo { display: grid; place-items: center; height: 150px; font-size: 65px; }
#seleccionActual { text-align: center; }

/* 2. ACOMODO DEL ESCENARIO: NO BORREN LOS id. */
#juego { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.hud { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; padding: 10px; background: var(--panel); border: 1px solid var(--borde); }
#escenario { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--escenario); background-position: center; background-size: cover; border: 1px solid var(--borde); }
#personaje { position: absolute; z-index: 4; width: clamp(45px,11vw,var(--tam-personaje)); height: clamp(55px,14vw,var(--tam-personaje)); display: grid; place-items: center; transition: left .75s ease,top .75s ease; }
#personaje img { width: 100%; height: 100%; object-fit: contain; }
#avatarEjemplo { font-size: clamp(35px,8vw,75px); }
#nombrePersonaje { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); max-width: 160%; padding: 2px 6px; background: var(--panel); color: var(--texto); font-size: 12px; text-align: center; }
/* PUERTA: se ubica automáticamente al final de la ruta de cada nivel. */
#puertaSalida { position:absolute; z-index:2; width:clamp(50px,12vw,var(--tam-puerta)); height:clamp(65px,15vw,130px); padding:0; border:2px solid #666; background:#ffffffbb; display:grid; place-items:center; overflow:hidden; }
#puertaSalida:disabled { opacity:.65; }
#puertaSalida.abierta { border:4px solid #268139; background:#e7ffe5dd; box-shadow:0 0 14px #44b855; }
#puertaSalida img { width:100%; height:100%; object-fit:contain; }
#puertaEjemplo { font-size:clamp(40px,9vw,80px); }
#personaje.entrando { opacity:0; transform:scale(.3); }
#personaje { transition:left .75s ease,top .75s ease,opacity .4s ease,transform .4s ease; }
#panelReto { position: absolute; z-index: 3; width: min(440px,44%); max-height: max(110px,calc(100% - 150px)); overflow: auto; padding: 20px; color: var(--texto); background: var(--panel); }
#panelReto.tarjeta { border: 2px solid var(--borde); border-radius: 16px; box-shadow: 0 8px 20px #0003; }
#panelReto.simple { border: 0; border-radius: 0; box-shadow: none; }
/* Las posiciones se eligen en configuracion o en cada nivel. */
/* Tarjeta centrada en la zona superior: deja un carril visible abajo. */
#panelReto.centro { left: 50%; top: calc((100% - 150px)/2); transform: translate(-50%,-50%); }
#panelReto.superiorIzquierda { left: 2%; top: 2%; }
#panelReto.superiorDerecha { right: 2%; top: 2%; }
#panelReto.inferiorIzquierda { left: 2%; bottom: 2%; }
#panelReto.inferiorDerecha { right: 2%; bottom: 2%; }
#panelReto.personalizada { left: var(--reto-x,2%); top: var(--reto-y,2%); }
/* OPCIONAL: descomenten SOLO este bloque si quieren controlar la posición
   directamente aquí. Reemplaza la posición seleccionada en configuracion. */
/*
#panelReto {
left: 5% !important;
top: 10% !important;
right: auto !important;
bottom: auto !important;
transform: none !important;
}
*/
/* En CSS: quiten SOLO las líneas de apertura y cierre del bloque opcional. */
#pregunta { font-size: var(--tam-reto); font-weight: bold; margin: 8px 0 14px; }
#opciones { line-height: 1.6; white-space: pre-line; }
label { display: block; margin-bottom: 5px; }
input { width: 100%; padding: 10px; border: 1px solid var(--borde); margin-bottom: 10px; background: white; color: #222; }
#mensaje { min-height: 20px; margin: 10px 0 0; font-size: 15px; }
#siguienteReto, #siguienteNivel { margin-top: 10px; }
#estado { margin: 0; font-size: 15px; background: var(--panel); padding: 6px; }
#juego > .acciones { margin: 0; }
#sala { background-color: #dddddd; text-align: center; }
#sala h2 { font-size: clamp(30px,5vw,50px); color: var(--titulo-perder); }
/* SALA DE MAESTROS: MENSAJE A LA IZQUIERDA, XIMENA GRANDE A LA DERECHA. */
#sala { padding: clamp(12px,3vw,36px); }
#sala .contenidoSala { width: min(1380px,100%); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr); align-items: center; gap: clamp(16px,3vw,44px); }
#sala .panel { width: 100%; text-align: left; }
/* AQUÍ CAMBIA EL TAMAÑO DE XIMENA: sube o baja 78dvh. */
#fotoXimena { display: block; width: 100%; height: 78dvh; object-fit: contain; }
#figuraXimena { margin: 0; min-width: 0; }
#figuraXimena figcaption { background: var(--panel); padding: 7px; font-weight: bold; }
@media(max-width:650px) {
  #sala .contenidoSala { grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  #fotoXimena { height: 64dvh; }
  #sala .panel { padding: 12px; }
  #sala h2 { margin: 0 0 8px; font-size: clamp(22px,5vw,30px); }
  #sala p { font-size: 14px; }
  #sala button { padding: 8px; font-size: 13px; }
}
#personajeSala { height: 110px; width: 110px; object-fit: contain; }
#victoria { text-align: center; background-color: var(--escenario); }
@media(max-width:650px) {
#avatares { grid-template-columns: repeat(2,1fr); }
.opcionAvatar img,.opcionAvatar .ejemplo { height: 110px; }
#panelReto { width: min(400px,70%); padding: 12px; }
#pregunta { font-size: 21px; }
.hud { font-size: 13px; padding: 7px; }
.hud button { padding: 7px; }
.panel { padding: 17px; }
}
@media(prefers-reduced-motion:reduce) { #personaje { transition: none; } }

}

<script>
/* Audio del equipo A toda mate: portada, fondo de niveles y efectos independientes.
   Safari y Chrome pueden requerir una interacción antes de reproducir. */
const musicaFondoMate=document.getElementById('musicaFondoMate');
const musicaPortadaMate=document.getElementById('musicaPortadaMate');
const controlMusicaMate=document.getElementById('controlMusicaMate');
let musicaMateHabilitada=true;
let pantallaMate='portada';
let ultimoEfectoMate=null;
const efectosMate={
 vida:new Audio('sonidos/perder vida-atodamate.mp3'),
 nivel:new Audio('sonidos/nivelcompletado-atodamate.mp3'),
 puerta:new Audio('sonidos/Level Complete-atodamate.mp3'),
 ganar:new Audio('sonidos/gana-atodamate.mp3')
};
for(const a of Object.values(efectosMate)){a.preload='none';a.volume=.76;}
efectosMate.nivel.volume=.37; // La celebración larga no debe ahogar la conversación.
musicaFondoMate.volume=.14;
musicaPortadaMate.volume=.19;
function reproducirSeguroMate(audio){
 if(!musicaMateHabilitada||document.hidden||!audio.paused)return;
 try{const p=audio.play();if(p?.catch)p.catch(()=>{});}catch(e){}
}
function sonarMusicaMate(){
 if(!musicaMateHabilitada||document.hidden)return;
 if(pantallaMate==='portada'||pantallaMate==='bienvenida'||pantallaMate==='seleccion'){
   musicaFondoMate.pause();reproducirSeguroMate(musicaPortadaMate);
 }else if(pantallaMate==='juego'&&!document.getElementById('pausa').open){
   musicaPortadaMate.pause();reproducirSeguroMate(musicaFondoMate);
 }else{musicaFondoMate.pause();musicaPortadaMate.pause();}
}
function cambiarMusicaMate(id){pantallaMate=id;sonarMusicaMate();}
function sonarEfectoMate(tipo){
 if(!musicaMateHabilitada||document.hidden)return;
 let a=efectosMate[tipo];if(!a)return;
 if(ultimoEfectoMate){ultimoEfectoMate.pause();ultimoEfectoMate.currentTime=0;}
 ultimoEfectoMate=a;
 musicaFondoMate.volume=.045;
 a.currentTime=0;
 a.onended=()=>{if(ultimoEfectoMate===a){ultimoEfectoMate=null;musicaFondoMate.volume=.14;}};
 try{const p=a.play();if(p?.catch)p.catch(()=>{musicaFondoMate.volume=.14;});}catch(e){musicaFondoMate.volume=.14;}
}
function ubicarControlMusicaMate(pantalla){
 const marcador=document.querySelector('#juego .hud');
 if(pantalla==='juego'&&marcador){marcador.appendChild(controlMusicaMate);controlMusicaMate.classList.add('en-juego');}
 else{document.body.appendChild(controlMusicaMate);controlMusicaMate.classList.remove('en-juego');}
 cambiarMusicaMate(pantalla);
}
controlMusicaMate.addEventListener('click',()=>{
 musicaMateHabilitada=!musicaMateHabilitada;
 controlMusicaMate.textContent=musicaMateHabilitada?'🔊 Silenciar':'🔇 Activar sonido';
 controlMusicaMate.setAttribute('aria-pressed',String(!musicaMateHabilitada));
 controlMusicaMate.setAttribute('aria-label',musicaMateHabilitada?'Silenciar música y sonidos de A toda mate':'Activar sonidos de A toda mate');
 if(!musicaMateHabilitada){musicaFondoMate.pause();musicaPortadaMate.pause();if(ultimoEfectoMate)ultimoEfectoMate.pause();}
 else sonarMusicaMate();
});
document.addEventListener('pointerdown',sonarMusicaMate,{capture:true,passive:true});
document.addEventListener('keydown',sonarMusicaMate,{capture:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){musicaFondoMate.pause();musicaPortadaMate.pause();if(ultimoEfectoMate)ultimoEfectoMate.pause();}else sonarMusicaMate();});
window.addEventListener('pagehide',()=>{musicaFondoMate.pause();musicaPortadaMate.pause();if(ultimoEfectoMate)ultimoEfectoMate.pause();});
sonarMusicaMate();
</script>

const $=id=>document.getElementById(id);
let elegido=null,nivelActual=0,indice=0,vidas=3,puntos=0,estado='menu';
let venceEn=0,restantePausa=0,estadoAntesPausa='',sesion=0;
function mostrar(id){
  for(const e of document.querySelectorAll('.pantalla'))e.hidden=e.id!==id;
  ubicarControlMusicaMate(id);
}
function imagen(id,ruta,respaldo){const el=$(id);el.hidden=true;if(respaldo)$(respaldo).hidden=false;if(!ruta){el.removeAttribute('src');return}el.onload=()=>{el.hidden=false;if(respaldo)$(respaldo).hidden=true};el.onerror=()=>{el.hidden=true;if(respaldo)$(respaldo).hidden=false};el.src=ruta}
function fondo(id,ruta){const el=$(id);el.style.backgroundImage='none';const peticion=String(sesion);el.dataset.fondoPeticion=peticion+':'+(ruta||'');if(!ruta)return;const img=new Image();img.onload=()=>{if(el.dataset.fondoPeticion===peticion+':'+ruta)el.style.backgroundImage=`url(${JSON.stringify(ruta)})`};img.src=ruta}
function configurarTextos(){document.title='Math Arcade | Math Pixels';$('tituloPortada').textContent=$('tituloJuego').textContent=configuracion.titulo;$('frasePortada').textContent=configuracion.frase;$('saludo').textContent=configuracion.bienvenida;$('integrantes').textContent=configuracion.integrantes;$('datosEquipo').textContent=configuracion.datos;$('descripcion').textContent=configuracion.descripcion;for(const texto of configuracion.instrucciones){const li=document.createElement('li');li.textContent=texto;$('listaInstrucciones').append(li)}$('tituloDerrota').textContent=configuracion.tituloDerrota;$('textoDerrota').textContent=configuracion.textoDerrota}
function crearSeleccion(){personajes.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='opcionAvatar';b.setAttribute('aria-pressed','false');const e=document.createElement('span');e.className='ejemplo';e.textContent=p.ejemplo||'🧑';const foto=document.createElement('img');foto.alt='Avatar de '+p.nombre;foto.hidden=true;if(p.imagen){foto.onload=()=>{foto.hidden=false;e.hidden=true};foto.onerror=()=>{foto.hidden=true;e.hidden=false};foto.src=p.imagen}const nombre=document.createElement('strong');nombre.textContent=p.nombre;b.append(e,foto,nombre);b.onclick=()=>{elegido=i;document.querySelectorAll('.opcionAvatar').forEach((el,n)=>el.setAttribute('aria-pressed',String(i===n)));$('seleccionActual').textContent='Elegiste a '+p.nombre;$('iniciar').disabled=false};$('avatares').append(b)})}
function irSeleccion(){sesion++;estado='seleccion';mostrar('seleccion')}
function validar(){if(personajes.length!==4)throw Error('Conserven cuatro personajes.');if(!niveles.length)throw Error('Agreguen al menos un nivel.');for(const n of niveles){if(!n.retos.length||n.ruta.length!==n.retos.length+1)throw Error('En '+n.nombre+', la ruta debe tener una posición más que el número de retos.');for(const r of n.retos)if(typeof r.respuesta!=='number'&&typeof r.respuesta!=='string')throw Error('Revisen una respuesta de '+n.nombre)}}
function iniciar(){if(elegido===null){irSeleccion();return}try{validar()}catch(e){alert(e.message);return}sesion++;vidas=configuracion.vidas;puntos=0;const p=personajes[elegido];$('avatarEjemplo').textContent=p.ejemplo||'🧑';$('nombrePersonaje').textContent=p.nombre;imagen('fotoPersonaje',p.imagen,'avatarEjemplo');cargarNivel(0)}
function configurarPanel(n){const posiciones=['centro','superiorIzquierda','superiorDerecha','inferiorIzquierda','inferiorDerecha','personalizada'];let pos=n.posicionReto||configuracion.posicionReto||'centro';if(!posiciones.includes(pos))pos='centro';const estilo=(n.estiloReto||configuracion.estiloReto)==='simple'?'simple':'tarjeta';$('panelReto').className=estilo+' '+pos;$('panelReto').style.setProperty('--reto-x',(n.retoX??configuracion.retoX??2)+'%');$('panelReto').style.setProperty('--reto-y',(n.retoY??configuracion.retoY??2)+'%')}
function cargarNivel(n){sesion++;nivelActual=n;indice=0;mostrar('juego');const actual=niveles[n];fondo('escenario',actual.fondo);configurarPanel(actual);$('personaje').classList.remove('entrando');$('puertaSalida').classList.remove('abierta');$('puertaSalida').disabled=true;$('puertaSalida').setAttribute('aria-label','Puerta cerrada: completa los retos');imagen('fotoPuerta',configuracion.puertaImagen,'puertaEjemplo');$('siguienteNivel').hidden=true;$('estado').textContent=actual.nombre+': resuelve los retos para avanzar.';colocar();cargarReto();marcador()}
function colocar(){
const [x,y]=niveles[nivelActual].ruta[indice],p=$('personaje'),esc=$('escenario');
  // Mantiene avatar y nombre dentro de la foto, incluso en pantallas pequeñas.
const ancho=esc.clientWidth,alto=esc.clientHeight;
p.style.left=Math.max(0,Math.min(ancho*x/100,ancho-p.offsetWidth-5))+'px';
p.style.top=Math.max(0,Math.min(alto*y/100,alto-p.offsetHeight-$('nombrePersonaje').offsetHeight-12))+'px';
const nivel=niveles[nivelActual], [dx,dy]=nivel.puerta||nivel.ruta[nivel.ruta.length-1], puerta=$('puertaSalida');
puerta.style.left=Math.max(0,Math.min(ancho*dx/100,ancho-puerta.offsetWidth-5))+'px';
puerta.style.top=Math.max(0,Math.min(alto*dy/100,alto-puerta.offsetHeight-12))+'px';
}
function abrirPuerta(){
$('puertaSalida').disabled=false;$('puertaSalida').classList.add('abierta');
$('puertaSalida').setAttribute('aria-label',nivelActual===niveles.length-1?'Entrar a la salida final':'Entrar al siguiente lugar');
if(configuracion.puertaAbiertaImagen)imagen('fotoPuerta',configuracion.puertaAbiertaImagen,'puertaEjemplo');
}

function marcador(){$('vidas').textContent=vidas;$('puntos').textContent=puntos;$('nombreNivel').textContent=(nivelActual+1)+'/'+niveles.length+' · '+niveles[nivelActual].nombre}
function segundos(){return Math.max(1,Number(configuracion.segundosPorReto)||30)}
function cargarReto(){estado='reto';const r=niveles[nivelActual].retos[indice];$('contadorRetos').textContent='Reto '+(indice+1)+' de '+niveles[nivelActual].retos.length;$('pregunta').textContent=r.pregunta;$('opciones').textContent=(r.opciones||[]).join('\n');$('respuesta').value='';$('respuesta').setAttribute('inputmode',typeof r.respuesta==='number'?'decimal':'text');$('respuesta').disabled=false;$('responder').disabled=false;$('siguienteReto').hidden=true;$('mensaje').textContent='';venceEn=performance.now()+segundos()*1000;$('tiempo').textContent=segundos();$('respuesta').focus({preventScroll:true})}
// Carga el archivo elegido arriba; si falta, conserva a Ximena visible con su foto integrada.
function cargarFotoXimena(){
  const foto=$('fotoXimena');
  $('figuraXimena').hidden=false;
  foto.hidden=true;
  foto.onload=()=>{foto.hidden=false};
  foto.onerror=()=>{
    foto.onerror=()=>{foto.hidden=true};
    foto.src=configuracion.ximenaImagenIntegrada;
  };
  foto.src=configuracion.ximenaImagen||configuracion.ximenaImagenIntegrada;
}
function irSala(){sesion++;estado='derrota';if($('pausa').open)$('pausa').close();mostrar('sala');fondo('sala',configuracion.salaMaestros);cargarFotoXimena();$('resumenDerrota').textContent='Llegaste al lugar '+(nivelActual+1)+' de '+niveles.length+' · Puntos: '+puntos;imagen('personajeSala',personajes[elegido].imagen)}
function perderVida(texto){if(estado!=='reto')return;sonarEfectoMate('vida');vidas--;marcador();$('respuesta').value='';if(configuracion.enviarPorPrimerError||vidas<=0){irSala();return}$('mensaje').textContent=texto+' Perdiste una vida. Inténtalo otra vez.';venceEn=performance.now()+segundos()*1000;$('tiempo').textContent=segundos()}
// Lee números, fracciones y raíces sin ejecutar código escrito por el jugador.
function leerNumero(texto){
 const limpio=texto.trim().replace(/,/g,'.').replace(/−/g,'-').replace(/\s+/g,'');
 if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(limpio))return Number(limpio);
 const fraccion=limpio.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))\/([+-]?(?:\d+(?:\.\d*)?|\.\d+))$/);
 if(fraccion){const denominador=Number(fraccion[2]);return denominador?Number(fraccion[1])/denominador:NaN}
 const raiz=limpio.match(/^([+-]?)(?:√(\d+(?:\.\d*)?)|(?:sqrt|raiz)\((\d+(?:\.\d*)?)\))$/i);
 if(raiz)return (raiz[1]==='-'?-1:1)*Math.sqrt(Number(raiz[2]??raiz[3]));
 return NaN;
}
function revisar(e){e.preventDefault();if(estado!=='reto')return;if(performance.now()>=venceEn){perderVida('Se acabó el tiempo.');return}const texto=$('respuesta').value.trim();if(!texto)return;const r=niveles[nivelActual].retos[indice];let correcta=false;if(typeof r.respuesta==='number'){const numero=leerNumero(texto);if(!Number.isFinite(numero)){$('mensaje').textContent='Escribe un número, una fracción (47/34) o una raíz (√2).';return}correcta=(r.respuestas||[r.respuesta]).some(valor=>Math.abs(numero-valor)<(r.tolerancia??0.00000001))}else{correcta=texto.toUpperCase().replace(/\s+/g,'')===r.respuesta.toUpperCase().replace(/\s+/g,'')}if(!correcta){perderVida('Respuesta incorrecta.');return}estado='moviendo';puntos+=configuracion.puntosPorAcierto;indice++;marcador();if(!configuracion.moverSoloAlCambiarLugar)colocar();$('respuesta').disabled=true;$('responder').disabled=true;$('mensaje').textContent=configuracion.moverSoloAlCambiarLugar?'¡Correcto! Completaste un reto de este lugar.':'¡Correcto! Tu personaje avanza.';const actual=sesion;setTimeout(()=>{if(sesion!==actual||estado!=='moviendo')return;despuesMovimiento()},850)}
function despuesMovimiento(){if(indice<niveles[nivelActual].retos.length){estado='acierto';$('siguienteReto').hidden=false;$('estado').textContent='¡Respuesta correcta! Pulsa Siguiente reto.'}else{estado='nivelCompleto';sonarEfectoMate('nivel');abrirPuerta();$('siguienteNivel').textContent=nivelActual===niveles.length-1?'Terminar recorrido':'Avanzar al siguiente lugar';$('siguienteNivel').hidden=false;$('mensaje').textContent='¡Puerta abierta! Pulsa la puerta para entrar al siguiente lugar.';$('estado').textContent='Continúa al siguiente escenario.'}}
function completarTraslado(){if(nivelActual<niveles.length-1){cargarNivel(nivelActual+1)}else{estado='victoria';sesion++;mostrar('victoria');sonarEfectoMate('ganar');fondo('victoria',configuracion.fondoVictoria);$('resumenVictoria').textContent=personajes[elegido].nombre+' completó '+niveles.length+' lugares · Puntos: '+puntos+' · Vidas restantes: '+vidas}}
function avanzarNivel(){
if(estado!=='nivelCompleto')return;
 sonarEfectoMate('puerta');
estado='traslado';$('siguienteNivel').hidden=true;
$('estado').textContent='¡Retos cumplidos! Tu personaje va al siguiente lugar.';
$('puertaSalida').disabled=true;
const p=$('personaje'),puerta=$('puertaSalida');
p.style.left=puerta.style.left;p.style.top=puerta.style.top;
const actual=sesion;
setTimeout(()=>{
    if(sesion!==actual||estado!=='traslado')return;
    p.classList.add('entrando');
    setTimeout(()=>{if(sesion===actual&&estado==='traslado')completarTraslado()},450);
},800);
}
function portada(){sesion++;estado='menu';if($('pausa').open)$('pausa').close();mostrar('portada')}
function pausar(){if(!['reto','moviendo','acierto','nivelCompleto','traslado'].includes(estado))return;musicaFondoMate.pause();estadoAntesPausa=estado;restantePausa=Math.max(0,venceEn-performance.now());estado='pausa';$('pausa').showModal()}
function continuar(){if(estado!=='pausa')return;$('pausa').close();sonarMusicaMate();estado=estadoAntesPausa;if(estado==='reto')venceEn=performance.now()+restantePausa;if(estado==='moviendo')despuesMovimiento();else if(estado==='traslado')completarTraslado()}
function reloj(){if(estado==='reto'){const restante=Math.max(0,Math.ceil((venceEn-performance.now())/1000));$('tiempo').textContent=restante;if(restante===0)perderVida('Se acabó el tiempo.')}requestAnimationFrame(reloj)}

imagen('fotoPortada',configuracion.portada);$('fotoPortada').addEventListener('load',()=>{$('portada').classList.add('con-imagen')});
imagen('fotoInstrucciones',configuracion.instruccionesImagen);fondo('bienvenida',configuracion.fondoBienvenida);fondo('seleccion',configuracion.fondoSeleccion);
$('verInstrucciones').onclick=()=>{estado='menu';mostrar('bienvenida')};$('irSeleccion').onclick=$('elegirDesdeInstrucciones').onclick=$('cambiarPersonaje').onclick=irSeleccion;
$('iniciar').onclick=$('reiniciar').onclick=$('reintentar').onclick=$('volverAJugar').onclick=iniciar;
for(const id of ['volverBienvenida','volverSeleccion','volverJuego','volverSala','volverVictoria'])$(id).onclick=portada;
$('formulario').addEventListener('submit',revisar);$('siguienteReto').onclick=()=>{if(estado==='acierto')cargarReto()};$('siguienteNivel').onclick=avanzarNivel;$('puertaSalida').onclick=avanzarNivel;
$('pausar').onclick=pausar;$('continuarPausa').onclick=continuar;$('pausa').addEventListener('cancel',e=>{e.preventDefault();continuar()});
window.addEventListener('blur',pausar);document.addEventListener('visibilitychange',()=>{if(document.hidden)pausar()});
window.addEventListener('resize',()=>{if(!$('juego').hidden)colocar()});
requestAnimationFrame(reloj);
</script>
<script>
/* El reto matemático no cubre la foto del colegio al jugar en celular vertical. */
(function(){
 const panel=document.getElementById('panelReto');
 const escenario=document.getElementById('escenario');
 const mq=window.matchMedia('(max-width:650px) and (orientation:portrait)');
 function distribuir(){
  if(mq.matches && panel.parentElement===escenario){escenario.after(panel)}
  else if(!mq.matches && panel.parentElement!==escenario){escenario.appendChild(panel)}
  if(!document.getElementById('juego').hidden && typeof colocar==='function')colocar();
 }
 distribuir();window.addEventListener('resize',distribuir);
})();
</script>
