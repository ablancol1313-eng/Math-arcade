<!DOCTYPE html>

<title>Math Arcade | Math Pixels</title> 
<style> 

/* ===== COLORES: EDITEN SOLO LOS VALORES DESPUÉS DE : ===== */
:root { 
    --pagina: #0D0847; /* CAMBIA: color del fondo exterior de la página. */
    --texto: #192338; /* CAMBIA: color de las letras generales. */
    --titulo: #254eaf; /* CAMBIA: color del título si después deciden mostrarlo. */
    --portada: #FFFFE0; /* CAMBIA: color detrás de la imagen de portada. */
    --botones: #254eaf; /* CAMBIA: color de los botones. */
    --texto-boton: #ffffff; /* CAMBIA: color de las letras de los botones. */
    --marcador: #ffffff; /* CAMBIA: color del marcador superior. */
    --panel-reto: #ffffffed; /* CAMBIA: color del recuadro de preguntas. */
    --panel-estado: #0D0847; /* CAMBIA: color del fondo de mensajes. */
    --campo-claro: #2b995a; /* CAMBIA: color claro del césped si NO usan imagen de cancha. */
    --campo-oscuro: #21864c; /* CAMBIA: color oscuro del césped si NO usan imagen de cancha. */
    --borde-cancha: #223353; /* CAMBIA: color del borde de la cancha. */
    --equipo-a: #b8d8ff; /* CAMBIA: fondo detrás de los Aldis del equipo A. */
    --borde-a: #124d9e; /* CAMBIA: borde de los Aldis del equipo A. */
    --equipo-b: #ffc8c8; /* CAMBIA: fondo detrás de los Aldis del equipo B. */
    --borde-b: #a71f28; /* CAMBIA: borde de los Aldis del equipo B. */
    --etiqueta: #ffffff; /* CAMBIA: fondo de los nombres de jugadores. */
    --texto-etiqueta: #111111; /* CAMBIA: color de los nombres de jugadores. */
    --campo-respuesta: #ffffff; /* CAMBIA: color del espacio para escribir la respuesta. */
    --borde-respuesta: #666677; /* CAMBIA: borde del espacio de respuesta. */
    --foco: #ec8400; /* CAMBIA: color del contorno al seleccionar. */
    --gol-fondo: #ffd21f; /* CAMBIA: color del letrero ¡GOOOOL!. */
    --gol-texto: #17213a; /* CAMBIA: color de las letras de ¡GOOOOL!. */
} 

* { box-sizing: border-box; } 
[hidden] { display: none !important; } 
html, body { height: 100%; }
body { margin: 0; font-family: Arial, sans-serif; background: var(--pagina); color: var(--texto); overflow: hidden; } 
main { width: min(1600px, 98vw); height: 100vh; margin: 0 auto; padding: 6px 0; }  
button, input { font: inherit; } 
button { padding: 10px 14px; border: 0; border-radius: 10px; background: var(--botones); color: var(--texto-boton); cursor: pointer; } 
button:disabled { opacity: .55; cursor: default; } 
button:focus-visible, input:focus-visible { outline: 3px solid var(--foco); outline-offset: 3px; } 
.tarjeta { background: var(--portada); border-radius: 18px; padding: 10px; } 
#portada {
    width: 100%;
    height: calc(100vh - 12px);
    margin: 0 auto;
    padding: 0;
    background: transparent;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
} 
#imagenPortada {
    width: 100%;
    height: calc(100vh - 185px);
    object-fit: cover; /* CAMBIA AQUÍ: "cover" llena todo sin bordes; "contain" muestra la imagen completa. */
    object-position: center; /* CAMBIA AQUÍ: center / top / bottom. */
    display: block;
    border-radius: 0;
    background: transparent;
} 
#comenzar { margin-top: 8px; padding: 14px 34px; font-size: 20px; font-weight: bold; } 
.hud { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--marcador); border-radius: 12px; margin-bottom: 6px; font-weight: bold; } 
#juego { height: calc(100vh - 12px); display: flex; flex-direction: column; }
#escenario { position: relative; width: 100%; flex: 1 1 auto; min-height: 260px; height: auto; overflow: hidden; border: 3px solid var(--borde-cancha); border-radius: 16px; background: var(--campo-claro); }  
#fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; } 
/* PORTERÍAS AMPLIAS: cambia height para abrirlas más y width para darles profundidad. */
.porteria {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 7%; height: 46%; min-width: 26px;
    border: 5px solid white; border-radius: 5px;
    background-color: #ffffff20;
    background-image: linear-gradient(#ffffff66 1px, transparent 1px), linear-gradient(90deg, #ffffff66 1px, transparent 1px);
    background-size: 12px 12px;
    box-shadow: 0 0 5px #0008; z-index: 2; pointer-events: none;
}
.porteria-izquierda { left: 0; }
.porteria-derecha { right: 0; }
/* Si cancha.webp ya tiene porterías y redes, se usan las de la imagen.
   Así no aparece otra portería encima ni queda desalineada con su red.
   Las porterías dibujadas solo se muestran si no se carga la imagen. */
#escenario.con-cancha-imagen .porteria { display: none; }

.figura { position: absolute; z-index: 3; width: clamp(38px, 6vw, 70px); height: clamp(42px, 7vw, 80px); text-align: center; } 
.figura img { width: 100%; height: 100%; object-fit: contain; } 
.emoji { font-size: clamp(28px, 5vw, 45px); } 
.nombre { display: block; background: var(--etiqueta); border-radius: 5px; font-size: 11px; padding: 2px; color: var(--texto-etiqueta); } 
.movil { z-index: 5; transition: left .7s ease, top .7s ease; } 
#retos { position: relative; z-index: 6; background: var(--panel-reto); padding: 16px; border-radius: 14px; margin: 14px 0 10px; }  
#pregunta { margin: 5px 0 10px; font-weight: bold; font-size: 18px; line-height: 1.2; } 
form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } 
input { min-width: 0; width: 120px; max-width: 100%; padding: 6px 8px; border: 2px solid var(--borde-respuesta); background: var(--campo-respuesta); color: var(--texto); border-radius: 8px; } 
#mensaje { min-height: 24px; margin: 8px 0; font-weight: bold; } 
#ayuda { font-size: 13px; background: var(--panel-estado); padding: 8px; } 
.acciones { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; } 
#estado { display: none; } 

#panelInferior {
    flex: 0 0 auto;
    margin-top: 6px;
    background: var(--panel-reto);
    border-radius: 14px;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
}
#retos {
    flex: 1 1 100%;
    margin: 0;
    padding: 0;
    background: transparent;
    border-radius: 0;
    text-align: center;
}
#pregunta { margin: 0 0 4px; }
#formulario { margin: 0; justify-content: center; }
#mensaje { min-height: 0; margin: 4px 0 0; }
#mensaje:empty { display: none; }
#continuar { margin-top: 4px; }
#ayuda { flex: 1 1 100%; margin: 0; }

#mensaje {
    text-align: center;
}
#continuar {
    display: block;
    margin-left: auto;
    margin-right: auto;
}

.acciones {
    margin: 0;
    gap: 8px;
    flex: 1 1 100%;
    justify-content: center;
}
.acciones button { padding: 8px 14px; }

#escenario { background: repeating-linear-gradient(90deg, var(--campo-oscuro) 0 12.5%, var(--campo-claro) 12.5% 25%); } 
.linea { position: absolute; left: 50%; height: 100%; border-left: 2px solid var(--lineas-cancha); } 
.circulo { position: absolute; left: 41%; top: 27%; width: 18%; height: 46%; border: 2px solid var(--lineas-cancha); border-radius: 50%; } 
.movil { width: 30px; height: 30px; } 
.movil .emoji { font-size: 27px; } 
.equipoA { background: var(--equipo-a); border: 2px solid var(--borde-a); border-radius: 12px; } 
.equipoB { background: var(--equipo-b); border: 2px solid var(--borde-b); border-radius: 12px; } 
#letreroGol {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
#letreroGol span {
    display: inline-block;
    padding: 18px 34px;
    border-radius: 22px;
    background: var(--gol-fondo);
    color: var(--gol-texto);
    border: 5px solid #ffffff;
    box-shadow: 0 10px 30px #00000055;
    font-weight: 900;
    font-size: clamp(44px, 10vw, 105px);
    letter-spacing: 3px;
    text-align: center;
    animation: animacionGol 1.7s ease both;
}
@keyframes animacionGol {
    0%   { transform: scale(.25) rotate(-8deg); opacity: 0; }
    20%  { transform: scale(1.18) rotate(3deg); opacity: 1; }
    45%  { transform: scale(1) rotate(0deg); opacity: 1; }
    80%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(.85); opacity: 0; }
}

@media (max-width: 700px) {
    #selectorEquipo {
        grid-template-columns: 90px auto 90px;
        gap: 8px;
    }
    .opcionEquipo { width: 90px; }
    .opcionEquipo img { height: 62px; }
    #zonaComenzar { min-width: 150px; }

    body { overflow: auto; }
    main { width: 98vw; height: auto; min-height: 100vh; padding: 6px 0 10px; }
    #portada { height: auto; min-height: calc(100vh - 12px); }
    #juego { height: auto; min-height: calc(100vh - 12px); }
    #escenario { min-height: 360px; height: 60vh; }
    #imagenPortada { height: 72vh; }
    .hud { gap: 8px; font-size: 14px; }
}


#selectorEquipo {
    display: grid;
    grid-template-columns: 120px auto 120px;
    justify-content: center;
    align-items: center;
    gap: 22px;
    margin-top: 8px;
}

.opcionEquipo {
    width: 120px;
    padding: 7px;
    border: 3px solid transparent;
    border-radius: 14px;
    background: #ffffff;
    cursor: pointer;
    opacity: .78;
    transition: transform .2s ease, opacity .2s ease, border-color .2s ease;
}

.opcionEquipo:hover {
    transform: scale(1.04);
    opacity: 1;
}

.opcionEquipo.seleccionado {
    opacity: 1;
    border-color: var(--foco);
    transform: scale(1.06);
}

.opcionEquipo img {
    width: 100%;
    height: 78px;
    object-fit: contain;
    display: block;
}

.opcionEquipo span {
    display: block;
    margin-top: 3px;
    font-weight: bold;
    color: var(--texto);
}

#zonaComenzar {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 220px;
}

#textoSeleccion {
    margin: 0 0 6px;
    font-weight: bold;
    text-align: center;
    font-size: 14px;
}

#comenzar {
    margin-top: 0;
    padding: 14px 34px;
    font-size: 20px;
    font-weight: bold;
}


/* BIENVENIDA E INSTRUCCIONES: esta pantalla aparece antes del partido. */
#bienvenida {
    height: calc(100dvh - 12px); /* Usa el espacio disponible de la pantalla. */
    overflow-y: auto; /* Permite leer todas las instrucciones en teléfonos. */
    padding: clamp(18px, 4vw, 42px);
    background-color: var(--portada);
    background-size: cover;
    background-position: center;
}
.bienvenida-contenido {
    width: min(900px, 100%);
    margin: 0 auto;
    padding: clamp(18px, 3vw, 30px);
    border-radius: 18px;
    background: #FFFFE0; /* Blanco casi opaco para leer sobre una foto. */
    color: #202020;
    line-height: 1.55;
}
#tituloBienvenida { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); }
#listaInstrucciones { padding-left: 24px; }
#listaInstrucciones li { margin: 10px 0; }
#equipoBienvenida { font-weight: bold; }
#bienvenida #comenzar { font-weight: bold; }
/* AQUÍ CAMBIA EL FONDO DE BIENVENIDA: guarda la imagen junto al HTML
   y quita los signos de comentario que rodean las siguientes líneas. */
/*
#bienvenida {
    background-image: url("FONDO-BIENVENIDA-FC.webp");
}
*/

/* PORTADA A PANTALLA COMPLETA: el botón se coloca SOBRE la imagen. */
#portada { position: relative; height: calc(100dvh - 12px); min-height: 0; overflow: hidden; }
#imagenPortada { height: 100%; width: 100%; object-fit: cover; }
/* EDITAR: bottom cambia la distancia del botón al borde inferior. */
#entrarBienvenida {
    position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%); width: auto; height: auto;
    padding: 14px 34px; border-radius: 12px; font-size: 22px; font-weight: bold;
    background: var(--botones); color: var(--texto-boton); box-shadow: 0 4px 18px #0005;
}
/* BIENVENIDA: encabezado arriba, contenido en dos columnas y botones siempre visibles. */
#bienvenida { height: calc(100dvh - 12px); overflow: hidden; padding: clamp(8px, 2vh, 18px); }
.bienvenida-contenido {
    width: min(1100px, 100%); height: 100%; min-height: 0;
    display: flex; flex-direction: column; gap: 10px;
    padding: clamp(12px, 2vh, 22px); overflow: hidden; line-height: 1.35;
}
.encabezado-bienvenida { flex: 0 0 auto; }
#tituloBienvenida { margin: 0 0 6px; font-size: clamp(23px, 3.7vw, 34px); }
.encabezado-bienvenida p { margin: 3px 0; font-size: 14px; }
.cuerpo-bienvenida {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(240px, 1fr);
    flex: 1 1 0; min-height: 0; gap: 20px;
}
.reglas-bienvenida { min-height: 0; overflow-y: auto; padding: 0 8px 0 0; }
/* En pantallas muy pequeñas solo se desplaza el texto de las reglas;
   la elección del equipo y los botones siguen a la vista. */
.cuerpo-bienvenida h2 { margin: 0 0 8px; font-size: 21px; }
#listaInstrucciones { margin: 0; padding-left: 22px; font-size: 14px; }
#listaInstrucciones li { margin: 0 0 8px; line-height: 1.35; }
.seleccion-bienvenida { min-width: 0; display: flex; flex-direction: column; justify-content: center; text-align: center; }
#bienvenida #selectorEquipo {
    display: grid; grid-template-columns: repeat(2, minmax(0, 130px));
    align-items: center; justify-content: center; gap: 10px; margin: 0;
}
#bienvenida .opcionEquipo { width: 100%; min-width: 0; }
#bienvenida .opcionEquipo img { height: clamp(55px, 13vh, 105px); }
#bienvenida #zonaComenzar { grid-row: 2; grid-column: 1 / -1; min-width: 0; }
#bienvenida #textoSeleccion { font-size: 14px; }
#bienvenida .acciones-bienvenida {
    flex: 0 0 auto; display: flex; flex-wrap: nowrap; justify-content: center; gap: 12px;
    margin: 0; padding-top: 10px; border-top: 1px solid #ddd;
}
#bienvenida #comenzar { margin: 0; padding: 12px 36px; font-size: 20px; }
@media (max-width: 650px) {
    .cuerpo-bienvenida { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
    #bienvenida .opcionEquipo img { height: 50px; }
    #bienvenida #selectorEquipo { grid-template-columns: repeat(2, minmax(0, 110px)); gap: 6px; }
    #bienvenida .acciones-bienvenida button { padding: 10px 14px; font-size: 16px; }
    .encabezado-bienvenida p { font-size: 12px; }
    #tituloBienvenida { font-size: 23px; }
}

/* Reserva espacio para que el sonido no tape el marcador. */
.hud { padding-right: 175px; min-height: 48px; }
/* Control de sonido visible en todas las pantallas. */
#controlSonido {
    position: fixed; top: 10px; right: 12px; z-index: 100;
    padding: 9px 13px; background: #15254deb; color: white;
    border: 2px solid #ffffffa0; border-radius: 12px;
    font-size: 14px; box-shadow: 0 2px 10px #0005;
}

button,input,select{touch-action:manipulation}

function reproducirPista() {
    if (!sonidoActivado || !pistaActual || document.hidden || pistaFinalizada) return;
    const intento = ++intentoAudio;

    if (resultado && typeof resultado.catch === "function") {

}
function cambiarMusica(pista, reiniciar = false) {
    if (pistaActual !== pista || reiniciar) {
        ++intentoAudio;
        musica.pause();
        pistaActual = pista;
        pistaFinalizada = false;
        musica.src = pistasSonido[pista];
        musica.currentTime = 0;
        musica.loop = pista !== "findejuego";
    }
    reproducirPista();
}
controlSonido.addEventListener("click", () => {

function nombreJugador() {
    return equipoElegido === "rayados" ? configuracion.nombreRayados : configuracion.nombreTigres;
}
function nombreRival() {
    return equipoElegido === "tigres" ? configuracion.nombreRayados : configuracion.nombreTigres;
}
function imagenJugador() {
    return equipoElegido === "rayados" ? configuracion.imagenRayados : configuracion.imagenTigres;
}
function imagenRival() {
    return equipoElegido === "tigres" ? configuracion.imagenRayados : configuracion.imagenTigres;
}

// Jugadores de campo alineados en dos filas (22 y 70) y cuatro columnas.
// Los dos porteros quedan alineados a la misma altura (45).
// En cada pareja: [posición horizontal, posición vertical].
// El quinto jugador de cada equipo es el portero: queda frente a la boca de su portería en cancha.webp.
// Se conserva cancha.webp: la imagen enviada es una captura de referencia con jugadores y recuadros rojos.
const posicionesA = [[18,22],[39,22],[39,70],[82,22],[8,45]];
const posicionesB = [[18,70],[61,22],[61,70],[82,70],[92,45]];

const buscar = (id) => document.getElementById(id);
let golesA = 0;
let golesB = 0;
let pasesTotales = 0;
let temporizadorFinalFC=null;
let pases = 0;
let robos = 0;
let errores = 0;
let etapa = "pases";
let pendiente = false;
let activo = false;
let preguntaActual = null;
let reloj = null;
let venceEn = 0;
let figuras = [];
let movil = null;
function detenerTiempo() {
    clearInterval(reloj);
    reloj = null;
}
function actualizarTiempo() {
    if (!activo || pendiente) { detenerTiempo(); return; }
    const restante = Math.max(0, venceEn - Date.now());
    buscar("tiempo").textContent = Math.ceil(restante / 1000);
    if (restante <= 0) { resolver(false, "Tiempo agotado."); }
}
function iniciarTiempo(segundos) {
    detenerTiempo();
    venceEn = Date.now() + segundos * 1000;
    buscar("tiempo").textContent = segundos;
    reloj = setInterval(actualizarTiempo, 100);
}
function avisoImagen(ruta) {
    buscar("ayuda").hidden = false;
    buscar("ayuda").textContent += "No se encontró " + ruta + ". Revisa nombre, carpeta y extensión. ";
}
function crearFigura(nombre, ruta, emoji, x, y, clase) {
    const elemento = document.createElement("div");
    elemento.className = "figura " + clase;
    const dibujo = document.createElement("span");
    dibujo.className = "emoji";
    dibujo.textContent = emoji;
    dibujo.setAttribute("role", "img");
    dibujo.setAttribute("aria-label", nombre);
    elemento.append(dibujo);
    if (ruta) {
        const foto = document.createElement("img");
        foto.alt = nombre;
        foto.hidden = true;
        foto.onload = () => { foto.hidden = false; dibujo.hidden = true; };
        foto.onerror = () => { foto.hidden = true; avisoImagen(ruta); };
        foto.src = ruta;
        elemento.append(foto);
    }
    if (clase !== "movil") {
        const etiqueta = document.createElement("small");
        etiqueta.className = "nombre";
        etiqueta.textContent = nombre;
        elemento.append(etiqueta);
    }
    buscar("figuras").append(elemento);
    // En móvil adapta nombres largos sin dividirlos en varias líneas.
    const etiquetaMovil=elemento.querySelector('.nombre');
    if(etiquetaMovil && window.matchMedia('(max-width:700px)').matches){
      for(let tam=8; tam>=6.2; tam-=.3){
        etiquetaMovil.style.setProperty('font-size',tam+'px','important');
        if(etiquetaMovil.scrollWidth<=etiquetaMovil.clientWidth+1)break;
      }
    }
    const figura = { elemento, x, y };
    figuras.push(figura);
    return figura;
}
function colocar() {
    const cancha = buscar("escenario");
    figuras.forEach((f) => {
        f.elemento.style.left = f.x / 100 * Math.max(0, cancha.clientWidth - f.elemento.offsetWidth) + "px";
        f.elemento.style.top = f.y / 100 * Math.max(0, cancha.clientHeight - f.elemento.offsetHeight) + "px";
    });
}
function llevarBalon(x, y) {
    movil.x = x;
    movil.y = y;
    colocar();
}
function juntoA(posicion) {
    llevarBalon(Math.min(97, posicion[0] + 4), Math.min(92, posicion[1] + 12));
}
function marcador() {
    buscar("golesA").textContent = golesA;
    buscar("golesB").textContent = golesB;
    const textos = { pases: "Pases: " + pases + "/" + configuracion.pasesNecesarios, jerarquia: "Jerarquía de operaciones", ecuacion: "Ecuación para tirar", defensa: "Defensa: " + robos + "/" + configuracion.robosNecesarios + " aciertos · " + errores + "/" + configuracion.erroresPermitidos + " errores", final: "Fin del partido" };
    buscar("avance").textContent = textos[etapa];
}
function elegir(lista) {
    return lista[Math.floor(Math.random() * lista.length)];
}
function nuevoAtaque() {
    etapa = "pases";
    pases = 0;
    robos = 0;
    errores = 0;
    juntoA(posicionesA[0]);
}
function prepararReto() {
    if (!activo) { return; }
    pendiente = false;
    let segundos;
    let prefijo;
    if (etapa === "pases") {
        const a = Math.floor(Math.random() * 10) + 3;
        const b = Math.floor(Math.random() * 10) + 3;
        preguntaActual = [a + " × " + b, a * b];
        prefijo = "Resuelve para dar el pase: ";
        segundos = configuracion.tiempoPase;
    } else if (etapa === "jerarquia") {
        preguntaActual = elegir(operaciones);
        prefijo = "Prepara el tiro: ";
        segundos = configuracion.tiempoJerarquia;
    } else if (etapa === "ecuacion") {
        preguntaActual = elegir(ecuaciones);
        prefijo = "Encuentra x para marcar: ";
        segundos = configuracion.tiempoEcuacion;
    } else {
        preguntaActual = elegir(divisiones);
        prefijo = "Recupera el balón: ";
        segundos = configuracion.tiempoDefensa;
    }
    buscar("pregunta").textContent = prefijo + preguntaActual[0];
    buscar("respuesta").value = "";
    buscar("respuesta").disabled = false;
    buscar("responder").disabled = false;
    buscar("continuar").hidden = true;
    buscar("mensaje").textContent = "";
    marcador();
    iniciarTiempo(segundos);
    buscar("respuesta").focus({ preventScroll: true });
}
function mostrarGol(texto = "¡GOOOOL!") {
    const caja = buscar("letreroGol");
    const textoGol = caja.querySelector("span");
    textoGol.textContent = texto;
    caja.classList.toggle("gol-rival",texto.includes("RIVAL"));
    if(!texto.includes("RIVAL")) golConSonido();
    caja.hidden = false;
    textoGol.style.animation = "none";
    void textoGol.offsetWidth;
    textoGol.style.animation = "animacionGol 2.2s ease both";
    clearTimeout(mostrarGol.temporizador);
    mostrarGol.temporizador = setTimeout(() => { caja.hidden = true; }, 2200);
}

function terminar() {
    cambiarMusica("findejuego", true);
    activo = false;
    etapa = "final";
    detenerTiempo();
    buscar("continuar").hidden = true;
    const ganaste = golesA >= configuracion.golesParaGanar;
    buscar("mensaje").textContent = ganaste ? "¡Ganaste el partido!" : "El equipo rival ganó. ¡Inténtalo nuevamente!";
    buscar("estado").textContent = "Resultado final: " + nombreJugador() + " " + golesA + " — " + golesB + " " + nombreRival();
    marcador();
    // Primero se ve el GOOOOL sobre la cancha; luego aparece el resumen.
    clearTimeout(temporizadorFinalFC);
    temporizadorFinalFC=setTimeout(()=>{
      buscar('resultadoIcono').textContent=ganaste?'🏆':'⚽';
      buscar('resultadoTitulo').textContent=ganaste?'¡CAMPEONES!':'GAME OVER';
      buscar('resultadoSubtitulo').textContent=ganaste?'¡Ganó '+nombreJugador()+'!':'¡Esta vez ganó '+nombreRival()+'!';
      buscar('resultadoMisGoles').textContent=golesA;
      buscar('resultadoPases').textContent=pasesTotales;
      buscar('resultadoGolesRival').textContent=golesB;
      buscar('resultadoMensaje').textContent=ganaste?'¡Excelente trabajo! Superaste los retos matemáticos.':'¡Buen esfuerzo! Intenta otra partida y consigue la revancha.';
      buscar('resultadoFC').hidden=false;
      buscar('resultadoRevancha').focus();
    },2100);
}
function resolver(correcto, motivo = "") {
    if (!activo || pendiente) { return; }
    pendiente = true;
    detenerTiempo();
    buscar("respuesta").disabled = true;
    buscar("responder").disabled = true;
    if(!correcto) sonidoIncorrectoFC();
    let mensaje = correcto ? "¡Correcto! " : (motivo || "Respuesta incorrecta.") + " ";
    if (etapa === "defensa") {
        if (correcto) { robos += 1; } else { errores += 1; }
        juntoA(posicionesB[(robos + errores) % 4]);
        if (robos >= configuracion.robosNecesarios) {
            mensaje += "¡Recuperaste el balón! Vuelve a completar los cinco pases.";
            nuevoAtaque();
        } else if (errores >= configuracion.erroresPermitidos) {
            golesB += 1;
            mostrarGol("¡GOL RIVAL!");
            llevarBalon(8, 51); // Gol dentro de la red izquierda de la imagen.
            mensaje += "Gol del equipo rival. Tu equipo saca del centro.";
            etapa = "pases"; pases = 0; robos = 0; errores = 0;
        } else {
            mensaje += "Defensa: " + robos + " aciertos y " + errores + " errores.";
        }
    } else if (!correcto) {
        etapa = "defensa";
        robos = 0; errores = 0;
        juntoA(posicionesB[0]);
        mensaje += "Balón para el rival. ¡A defender!";
    } else if (etapa === "pases") {
        pases += 1;
        pasesTotales += 1;
        const receptor = [1, 2, 3, 0, 3][(pases - 1) % 5];
        juntoA(posicionesA[receptor]);
        mensaje += "Pase " + pases + " de " + configuracion.pasesNecesarios + " completado.";
        if (pases >= configuracion.pasesNecesarios) { etapa = "jerarquia"; mensaje += " Ahora prepara el tiro con jerarquía de operaciones."; }
    } else if (etapa === "jerarquia") {
        etapa = "ecuacion";
        mensaje += "Puedes intentar marcar. El siguiente reto es una ecuación.";
    } else {
        golesA += 1;
        mostrarGol("¡GOOOOL!");
        llevarBalon(92, 51); // Gol dentro de la red derecha de la imagen.
        mensaje += "¡GOOOOL! Tu equipo lleva " + golesA + " goles.";
        etapa = "pases"; pases = 0;
    }
    buscar("mensaje").textContent = mensaje;
    buscar("estado").textContent = mensaje;
    marcador();
    if (golesA >= configuracion.golesParaGanar || golesB >= configuracion.golesParaGanar) { terminar(); return; }
    buscar("continuar").textContent = etapa === "defensa" ? "Continuar defensa" : "Continuar jugada";
    buscar("continuar").hidden = false;
}
function responder(evento) {
    evento.preventDefault();
    if (!activo || pendiente) { return; }
    if (Date.now() >= venceEn) { resolver(false, "Tiempo agotado."); return; }
    const texto = buscar("respuesta").value.trim();
    const numero = texto === "" ? NaN : Number(texto.replace(",", "."));
    if (!Number.isFinite(numero)) { resolver(false, "Debes escribir un número. Cuenta como error."); return; }
    resolver(Math.abs(numero - preguntaActual[1]) <= 0.000001);
}

// BIENVENIDA: abre las instrucciones sin iniciar el tiempo ni el partido.
function abrirBienvenida() {
    cambiarMusica("bienvenida", true);
    activo = false; // El jugador todavía no está jugando.
    detenerTiempo(); // Asegura que ningún cronómetro siga corriendo.
    buscar("portada").hidden = true;
    buscar("juego").hidden = true;
    buscar("bienvenida").hidden = false;
    buscar("textoSeleccion").textContent = equipoElegido
        ? "Tu equipo: " + nombreJugador() + ". Rival: " + nombreRival() + "."
        : "Elige Tigres o Rayados. Jugarás contra el otro equipo.";
    // Se pueden leer las instrucciones sin haber elegido equipo.
    buscar("comenzar").disabled = !equipoElegido;
    buscar("tituloBienvenida").focus(); // Lleva la atención al título de esta pantalla.
}

function volverAPortada() {
    clearTimeout(temporizadorFinalFC);
    buscar('resultadoFC').hidden=true;
    efectoGolFC.pause();
    cambiarMusica("portada", true);
    activo = false; // Detiene la partida al salir.
    detenerTiempo();
    buscar("juego").hidden = true;
    buscar("bienvenida").hidden = true;
    buscar("portada").hidden = false;
    // El foco vuelve a la imagen de portada, que funciona como botón de entrada.
    buscar("entrarBienvenida").focus();
}

// Arma los textos una sola vez, usando las reglas de configuracion.
function prepararBienvenida() {
    buscar("tituloBienvenida").textContent = configuracion.bienvenida;
    buscar("descripcionBienvenida").textContent = configuracion.descripcionBienvenida;
    buscar("integrantesBienvenida").textContent = "Integrantes: " + configuracion.integrantes;
    buscar("integrantesBienvenida").hidden = !configuracion.integrantes.trim();
    buscar("datosBienvenida").textContent = configuracion.datosEquipo;
    // Si cambian los tiempos o las metas arriba, las instrucciones se actualizan solas.
    const instrucciones = [
        "Elige Tigres o Rayados. Si eliges Tigres, juegas contra Rayados; si eliges Rayados, juegas contra Tigres. Cada equipo tiene cinco jugadores.",
        "Completa " + configuracion.pasesNecesarios + " pases respondiendo multiplicaciones. Tienes " + configuracion.tiempoPase + " segundos por pase.",
        "Prepara el tiro resolviendo una operación con jerarquía de operaciones. Tienes " + configuracion.tiempoJerarquia + " segundos.",
        "Resuelve una ecuación y encuentra el valor de x para marcar gol. Tienes " + configuracion.tiempoEcuacion + " segundos.",
        "Escribe el resultado y presiona Enter o el botón Responder. Al terminar cada reto, pulsa Continuar jugada o Continuar defensa.",
        "Si fallas o se agota el tiempo en ataque, el rival recibe el balón y debes defender.",
        "En defensa, resuelve divisiones en " + configuracion.tiempoDefensa + " segundos por reto. Con " + configuracion.robosNecesarios + " aciertos recuperas el balón; con " + configuracion.erroresPermitidos + " errores, el rival marca un gol.",
        "Aquí no hay vidas: gana el primer equipo que llegue a " + configuracion.golesParaGanar + " goles."
    ];
    const lista = buscar("listaInstrucciones");
    lista.replaceChildren(); // Limpia la lista antes de escribir las reglas.
    for (const texto of instrucciones) {
        const renglon = document.createElement("li"); // Crea un punto de la lista.
        renglon.textContent = texto; // Coloca el texto de la instrucción.
        lista.appendChild(renglon); // Lo agrega a las instrucciones visibles.
    }
}

function iniciar() {
    if (!equipoElegido) {
        document.getElementById("textoSeleccion").textContent = "Primero elige una playera de Aldi.";
        return;
    }
    clearTimeout(temporizadorFinalFC);
    buscar('resultadoFC').hidden=true;
    efectoGolFC.pause();musica.volume=volumenSonido;
    pasesTotales=0;
    detenerTiempo();
    buscar("bienvenida").hidden = true; // Oculta las instrucciones al comenzar el partido.
    buscar("portada").hidden = true; buscar("juego").hidden = false; buscar("nombreA").textContent = nombreJugador(); buscar("nombreB").textContent = nombreRival();
    cambiarMusica("durantepartida", true);
    golesA = 0; golesB = 0; activo = true; pendiente = false;
    figuras = []; buscar("figuras").replaceChildren();
    buscar("ayuda").hidden = true; buscar("ayuda").textContent = "";
    buscar("letreroGol").hidden = true;
    // Los nombres y las playeras siguen al club elegido, incluso al reiniciar.
    const jugadoresUsuario = equipoElegido === "tigres" ? configuracion.jugadoresTigres : configuracion.jugadoresRayados;
    const jugadoresRival = equipoElegido === "tigres" ? configuracion.jugadoresRayados : configuracion.jugadoresTigres;
    posicionesA.forEach((p, i) => crearFigura(jugadoresUsuario[i], imagenJugador(), "👕", p[0], p[1], "equipoA"));
    posicionesB.forEach((p, i) => crearFigura(jugadoresRival[i], imagenRival(), "👕", p[0], p[1], "equipoB"));
    movil = crearFigura("Balón", configuracion.balon, "⚽", 12, 70, "movil");
    nuevoAtaque();
    buscar("estado").textContent = "Completa cinco pases, supera jerarquía y resuelve x para marcar. Gana el primero en llegar a cinco goles.";
    prepararReto();
}
document.title = 'Math Arcade | Math Pixels';
buscar("imagenPortada").src = configuracion.portada;
buscar("imagenPortada").onerror = () => { buscar("imagenPortada").alt = "Agrega tu imagen en: " + configuracion.portada; };
buscar("nombreA").textContent = ""; buscar("nombreB").textContent = "";
if (configuracion.cancha) {

}
// La imagen de portada abre la bienvenida sin iniciar el partido.
prepararBienvenida();
