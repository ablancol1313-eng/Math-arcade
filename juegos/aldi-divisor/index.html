<style>
/* ==========================================================
   ZONA 1: COLORES. CAMBIEN SOLO LOS VALORES DESPUÉS DE :
   Pueden usar nombres (white, blue...) o códigos (#ffffff...).
   ========================================================== */
:root {
  --pagina: skyblue;             /* CAMBIA: fondo general. */
  --texto: #222222;            /* CAMBIA: letras. */
  --portada: #eeeeee;          /* CAMBIA: portada sin imagen. */
  --instrucciones: skyblue;      /* CAMBIA: bienvenida sin imagen. */
  --escenario: #eeeeee;        /* CAMBIA: escenario sin imagen. */
  --panel: #fffffff0;          /* CAMBIA: cuadros de texto. */
  --boton: #dddddd;            /* CAMBIA: botones. */
  --texto-boton: black;        /* CAMBIA: letras de botones. */
  --borde: #777777;            /* CAMBIA: bordes. */
  --pasto: #9bcf72;            /* CAMBIA: parte superior de escalones. */
  --tierra: #b48b6a;           /* CAMBIA: cuerpo de escalones. */
  --tam-aldi: 76px;           /* CAMBIA: tamaño de Aldi. */
  --tam-objetos: 78px;         /* CAMBIA: tamaño de llave y puerta. */
  --letrero-fondo: skyblue;      /* CAMBIA: fondo del letrero al perder. */
  --letrero-texto: #a51616;    /* CAMBIA: color del mensaje al perder. */
  --letrero-tamano: 48px;      /* CAMBIA: tamaño máximo de su mensaje. */
  --tam-reto: 24px;           /* CAMBIA: tamaño de las operaciones. */
}

/* OPCIONAL: fondo de toda la página. Quiten las marcas exteriores
   barra-asterisco y asterisco-barra del siguiente bloque para activarlo.
   Cambien el nombre de archivo y guárdenlo junto al HTML. */
/*
body {
  background-image: url('portada.webp');
  background-size: cover;
  background-position: center;
}
*/

/* ZONA 2: ACOMODO. Pueden cambiar tamaños, pero NO borren los id. */
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; color: var(--texto); background-color: var(--pagina); }
[hidden] { display: none !important; }
button, input { font: inherit; }
button { padding: 10px 18px; border: 1px solid var(--borde); background: var(--boton); color: var(--texto-boton); cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid #2462bc; outline-offset: 3px; }
.pantalla { height: 100dvh; overflow: auto; position: relative; background-size: cover; background-position: center; }
.centrada { display: grid; place-items: center; padding: 20px; }
.panel { width: min(850px, 100%); background: var(--panel); border: 1px solid var(--borde); padding: 24px; }
h1 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 15px; }
h2 { font-size: 26px; }
p, li { font-size: 17px; line-height: 1.5; }
.acciones { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
#portada { background-color: var(--portada); text-align: center; }
#portada .panel { position: relative; align-self: end; width: auto; margin-bottom: 15px; }
/* Portada completa, centrada y sin deformar ni recortar la imagen.
   Los botones tienen su propio espacio para no tapar el diseño. */
#portada.con-imagen {
  padding: 0;
  overflow: hidden;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 0;
}
#imagenPortada {
  display: block;
  position: relative;
  grid-row: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: contain; /* Mantiene completa la portada y conserva sus proporciones. */
  object-position: center;
}
#portada.con-imagen .panel {
  grid-row: 2;
  width: 100%;
  margin: 0;
  padding: 12px;
}
#portada.con-imagen .acciones { margin-top: 0; }

#portada.con-imagen .textoPortada { display: none; }
#bienvenida { background-color: var(--instrucciones); }
#imagenInstrucciones { width: 100%; max-height: 40vh; object-fit: contain; display: block; margin: 15px auto; }

/* ESCENARIO: estos elementos mantienen el recorrido dentro de la pantalla. */
#juego { display: flex; flex-direction: column; gap: 8px; padding: 10px; }
.hud { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 10px; background: var(--panel); border: 1px solid var(--borde); }
#escenario { position: relative; flex: 1; min-height: 0; overflow: hidden; background-color: var(--escenario); border: 2px solid var(--borde); }
#fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.escalon { position: absolute; height: 8%; background: var(--tierra); border-top: 8px solid var(--pasto); z-index: 1; border-radius: 2px; box-shadow: 0 3px 0 rgba(0,0,0,.10); }
/* Estas posiciones iniciales las reemplaza recorrido al comenzar cada nivel.
   Para mover los bloques, editen recorrido en la ZONA 4. */
.e1 { left: 2%; top: 85%; width: 14%; }
.e2 { left: 16%; top: 74%; width: 12%; }
.e3 { left: 28%; top: 62%; width: 12%; }
.e4 { left: 38%; top: 49%; width: 12%; }
.e5 { left: 48%; top: 38%; width: 12%; }
.e6 { left: 59%; top: 27%; width: 13%; }
/* Los escalones se acomodan automáticamente según la ruta de cada nivel.
   Usen fondos decorativos sin plataformas. Si las dibujan en Canva,
   pueden activar ocultarPlataformas y hacer que coincidan con su ruta. */
#escenario.sin-plataformas .escalon { display: none; }
#aldi { position: absolute; width: clamp(36px, 8vw, var(--tam-aldi)); height: clamp(42px, 9vw, var(--tam-aldi)); z-index: 4; display: grid; place-items: center; transition: left .7s ease, top .7s ease; }
#aldi img { width: 100%; height: 100%; object-fit: contain; }
#aldiEjemplo { font-size: clamp(30px, 6vw, 58px); }
.objeto { position: absolute; width: clamp(28px, 7vw, var(--tam-objetos)); height: clamp(32px, 8vw, var(--tam-objetos)); z-index: 2; display: grid; place-items: center; }
.objeto img { width: 100%; height: 100%; object-fit: contain; }
.objeto span { font-size: clamp(26px, 5vw, 50px); }
#llave { left: 41%; top: 27%; }
#puerta { left: 61%; top: 5%; filter: drop-shadow(0 3px 6px rgba(0,0,0,.28)); }
#retos { position: absolute; right: 2%; bottom: 3%; width: min(330px, 38%); padding: 14px; background: var(--panel); border: 1px solid var(--borde); z-index: 5; }
/* RETOS ABAJO A LA DERECHA, como en la última plantilla que trabajamos.
   Si los quieren ARRIBA A LA IZQUIERDA, descomenten este bloque: */
/*
#retos { left: 2%; top: 2%; right: auto; bottom: auto; }
*/
#pregunta { font-size: var(--tam-reto); font-weight: bold; margin: 0 0 10px; }
label { display: block; margin: 8px 0 5px; }
input { width: 100%; padding: 9px; border: 1px solid var(--borde); color: var(--texto); background: white; margin-bottom: 10px; }
#mensaje { font-size: 15px; margin: 10px 0 0; }
#continuar { margin-top: 10px; }
#estado { margin: 0; padding: 6px; font-size: 15px; background: var(--panel); }
#juego > .acciones { margin: 0; }
.salto { animation: saltar .7s ease; }
@keyframes saltar { 50% { transform: translateY(-25px); } }
@media (max-width: 600px) {
  #retos { width: 45%; padding: 9px; }
  #pregunta { font-size: 18px; }
  #retos button { padding: 8px; font-size: 14px; }
  .hud { font-size: 13px; }
  #estado { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  #aldi { transition: none; }
  .salto { animation: none; }
}
/* LETRERO GRANDE AL QUEDARSE SIN VIDAS. Pueden editar colores arriba. */
#sinVidas {
  width: min(750px, calc(100% - 30px));
  max-height: 90dvh;
  overflow: auto;
  padding: clamp(24px, 5vw, 50px);
  text-align: center;
  background: var(--letrero-fondo);
  color: var(--letrero-texto);
  border: 4px solid var(--letrero-texto);
}
#sinVidas::backdrop { background: #000b; }
#tituloSinVidas { font-size: clamp(28px, 6vw, var(--letrero-tamano)); line-height: 1.15; margin: 0 0 20px; }
#textoSinVidas { font-size: clamp(21px, 4vw, 32px); }

/* El control tiene su propio espacio en el marcador y en la portada. */
#controlSonidoAldi { border-radius: 8px; padding: 7px 12px; }
.control-audio { position: absolute; top: 12px; right: 12px; z-index: 10; }

/* Compatibilidad táctil y tamaño legible en celular */
html{-webkit-text-size-adjust:100%}
button,input,select{touch-action:manipulation}
button{min-height:36px}
@media(max-width:650px){button{max-width:100%}input{max-width:100%;font-size:16px}img{max-width:100%}}

button{min-height:44px;touch-action:manipulation}
input{font-size:16px;min-height:44px}

/* Salida a la portada principal del proyecto desde cualquier pantalla */
.volver-arcade {
 position:fixed;top:10px;left:12px;z-index:999999;min-height:38px;

/* Ajustes finales: escalones más visibles y puerta más notoria */

  .escalon{height:9%; border-top-width:6px;}

 .pantalla{height:calc(100dvh - var(--arcade-nav-altura))!important;}

<div id="zonaSonidoAldi" class="control-audio">
  <button id="controlSonidoAldi" type="button" aria-pressed="true" aria-label="Silenciar sonidos">🔇 Silenciar</button>
</div>
<!-- NO CAMBIEN LOS id NI BORREN LOS BOTONES: el motor los utiliza. -->

<script>
'use strict';

// ===== SONIDOS: guarda la carpeta sonidos junto a este HTML. =====
const sonidosAldi = {
  portada: 'sonidos/portada.mp3', // Efecto breve al abrir la portada (3 segundos).
  correcto: 'sonidos/correcto.mp3', // Al responder correctamente.
  incorrecto: 'sonidos/incorrecto.mp3', // Al equivocarse o agotar el tiempo.
  llave: 'sonidos/llave.mp3', // Al conseguir la llave con el tercer acierto.
  nivel: 'sonidos/nivel.mp3', // Al abrir la puerta o completar el juego.
  reintentar: 'sonidos/reintentar.mp3' // Al perder las tres vidas.
};
// Música larga del equipo: suena en bucle durante los niveles y se pausa al salir.
// Es independiente de los efectos, para que una respuesta no corte la música.
const musicaJuegoAldi = new Audio('sonidos/musica fondo.mp3');
musicaJuegoAldi.loop = true;
musicaJuegoAldi.preload = 'auto';
musicaJuegoAldi.volume = 0.09; // Música de partida bajita para distinguir aciertos y llaves.
// La melodía corta suena en bucle tanto en Portada como en Bienvenida.
const musicaPortadaAldi = new Audio(sonidosAldi.portada);
musicaPortadaAldi.loop = true;
musicaPortadaAldi.preload = 'auto';
musicaPortadaAldi.volume = 0.32;
let pantallaAudioAldi = 'portada';
const VOLUMEN_FONDO_ALDI = 0.09;
const VOLUMEN_FONDO_CON_EFECTO = 0.025;
function reproducirMusicaAldi() {
  if (!audioHabilitado || document.hidden || pantallaAudioAldi !== 'juego') return;
  try {
    const intento = musicaJuegoAldi.play();
    if (intento && typeof intento.catch === 'function') intento.catch(() => {});
  } catch(e) { /* El navegador puede requerir un toque. */ }
}
function reproducirPortadaAldi() {
  if (!audioHabilitado || document.hidden || pantallaAudioAldi === 'juego' || !musicaPortadaAldi.paused) return;
  try {
    const intento = musicaPortadaAldi.play();
    if (intento && intento.catch) intento.catch(() => {}); // iOS: requiere primer toque.
  } catch(e) {}
}
const efectoAldi = new Audio(); // Un solo reproductor evita sonidos encimados.
efectoAldi.preload = 'none';
efectoAldi.volume = 0.95; // Efectos destacados por encima de la música de fondo.
let audioHabilitado = true, colaSonidos = [], revisionSonido = 0;
const botonSonido = document.getElementById('controlSonidoAldi');
function detenerSonidos() {
  revisionSonido++;
  colaSonidos = [];
  efectoAldi.pause();
  efectoAldi.currentTime = 0;
  musicaJuegoAldi.volume = VOLUMEN_FONDO_ALDI;
}
function siguienteSonido() {
  if (!audioHabilitado || document.hidden || !colaSonidos.length) { musicaJuegoAldi.volume=VOLUMEN_FONDO_ALDI; return; }
  musicaJuegoAldi.volume = VOLUMEN_FONDO_CON_EFECTO;
  const nombre = colaSonidos.shift(), revision = ++revisionSonido;
  efectoAldi.src = sonidosAldi[nombre];
  efectoAldi.currentTime = 0;
  const intento = efectoAldi.play();
  if (intento && intento.catch) intento.catch(() => {
    // Si el navegador bloquea el audio, el juego puede continuar.
    if (revision === revisionSonido) { colaSonidos = []; musicaJuegoAldi.volume=VOLUMEN_FONDO_ALDI; }
  });
}
function sonar(...nombres) {
  detenerSonidos();
  if (!audioHabilitado || document.hidden) return;
  colaSonidos = nombres;
  siguienteSonido();
}
efectoAldi.addEventListener('ended', siguienteSonido);
efectoAldi.addEventListener('error', () => { colaSonidos = []; musicaJuegoAldi.volume=VOLUMEN_FONDO_ALDI; });
botonSonido.addEventListener('click', () => {
  audioHabilitado = !audioHabilitado;
  if (!audioHabilitado) {
    detenerSonidos();
    musicaJuegoAldi.pause();
    musicaPortadaAldi.pause();
  } else if (pantallaAudioAldi === 'juego') {
    reproducirMusicaAldi();
  } else {
    reproducirPortadaAldi();
  }
  botonSonido.textContent = audioHabilitado ? '🔇 Silenciar' : '🔊 Reanudar';
  botonSonido.setAttribute('aria-pressed', String(audioHabilitado));
  botonSonido.setAttribute('aria-label', audioHabilitado ? 'Silenciar sonidos' : 'Reanudar sonidos');
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { detenerSonidos(); musicaJuegoAldi.pause(); musicaPortadaAldi.pause(); }
  else if (pantallaAudioAldi === 'juego') reproducirMusicaAldi();
  else reproducirPortadaAldi();
});
window.addEventListener('pagehide', () => { detenerSonidos(); musicaJuegoAldi.pause(); musicaPortadaAldi.pause(); });
// En iPhone, el navegador suele impedir audio automático: se activa en el primer toque.
for (const evento of ['pointerdown','touchstart','keydown']) {
  document.addEventListener(evento, () => {
    if (pantallaAudioAldi === 'juego') reproducirMusicaAldi();
    else reproducirPortadaAldi();
  }, { capture:true, passive:true });
}
// Intentar reproducir el efecto de portada al cargar; si está bloqueado se reintenta al tocar.
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', reproducirPortadaAldi, { once:true });
} else reproducirPortadaAldi();
// ===== FIN DE SONIDOS =====

/* ===========================================================
   NO MOVER DESDE AQUÍ HASTA EL FINAL DEL ARCHIVO.
   Motor: botones, respuestas, vidas, puntos y movimiento.
   Aldi avanza automáticamente al acertar; no usa las flechas.
   Es un recorrido animado: no utiliza gravedad ni colisiones.
   =========================================================== */
const $ = id => document.getElementById(id);
let nivelActual=0, recorrido=niveles[0].recorrido, retos=niveles[0].retos;
let puertaLista=false;
let indice=0, vidas=3, puntos=0, activo=false, resuelto=false;
let venceEn=0, partida=0;
// NO MOVER: el reloj usa tiempo real, no cuenta la velocidad de la computadora.
function reiniciarTiempo(){venceEn=performance.now()+Math.max(1,Number(configuracion.segundosPorReto)||30)*1000;actualizarTiempo()}
function actualizarTiempo(){if(activo&&!resuelto)$('tiempo').textContent=Math.max(0,Math.ceil((venceEn-performance.now())/1000))}
function reloj(){
  if(activo&&!resuelto){
    actualizarTiempo();
    if(performance.now()>=venceEn){
      vidas--;marcador();$('respuesta').value='';
      if(vidas<=0)terminar(false);
      else{sonar('incorrecto');$('mensaje').textContent='Se acabó el tiempo. Perdiste una vida. Intenta la misma operación otra vez.';reiniciarTiempo()}
    }
  }
  requestAnimationFrame(reloj);
}
function mostrar(id) {
  detenerSonidos();
  pantallaAudioAldi = id;
  if (id === 'juego') {
    musicaPortadaAldi.pause();
    musicaPortadaAldi.currentTime=0;
    reproducirMusicaAldi();
  } else {
    musicaJuegoAldi.pause();
    reproducirPortadaAldi();
  }
  const zona = $('zonaSonidoAldi');
  zona.classList.toggle('control-audio', id !== 'juego');
  (id === 'juego' ? document.querySelector('.hud') : document.body).append(zona);
  for(const e of document.querySelectorAll('.pantalla')) e.hidden=e.id!==id;
}
function cargarImagen(id,ruta,respaldo,despues) {
  if(!ruta) return;
  const img=$(id);
  img.onload=()=>{img.hidden=false;if(respaldo)$(respaldo).hidden=true;if(despues)despues()};
  img.onerror=()=>{img.hidden=true;if(respaldo)$(respaldo).hidden=false};
  img.src=ruta;
}
function fondoBienvenida(ruta) {
  if(!ruta) return;
  const img=new Image();
  img.onload=()=>{$('bienvenida').style.backgroundImage=`url(${JSON.stringify(ruta)})`};
  img.src=ruta;
}
/* Ajuste responsivo: las coordenadas del recorrido son el punto donde
   se coloca Aldi; la plataforma debe quedar justo bajo sus pies.
   En celular se usa un personaje proporcional al área de juego y se
   comprime un poco el recorrido vertical para evitar escalones recortados. */
function colocar() {
  const aldi=$('aldi'), escenario=$('escenario'), [x,y]=recorrido[indice];
  const vistaReducida=window.matchMedia('(max-width: 900px)').matches;
  const altoEscenario=escenario.clientHeight;
  if(vistaReducida && altoEscenario>0){
    // Evita que una imagen de 76px ocupe un tercio del juego en horizontal.
    const alturaAldi=Math.min(44,Math.max(27,altoEscenario*0.115));
    aldi.style.height=alturaAldi+'px';
    aldi.style.width=alturaAldi+'px';
  } else {
    // Mantener exactamente el diseño original en computadora.
    aldi.style.removeProperty('height');
    aldi.style.removeProperty('width');
  }
  // En móvil la parte inferior queda libre incluso con una pantalla corta.
  const posY=valor=>vistaReducida?Math.max(0,valor*0.90):valor;
  aldi.style.left=x+'%';aldi.style.top=posY(y)+'%';
  const altoAldi=aldi.getBoundingClientRect().height;
  const escalones=document.querySelectorAll('.escalon');
  escalones.forEach((e,i)=>{e.hidden=i>=recorrido.length});
  const anchoEscalon=vistaReducida ? 18 : 16;
  recorrido.forEach(([px,py],i)=>{
    const e=escalones[i];if(e){
      e.style.left=Math.max(0,Math.min(100-anchoEscalon,px-3))+'%';
      e.style.top=`calc(${posY(py)}% + ${altoAldi}px)`;
      e.style.width=anchoEscalon+'%';
    }
  });
  const [lx,ly]=recorrido[3], [dx,dy]=recorrido[recorrido.length-1];
  $('llave').style.left=lx+'%';$('llave').style.top=posY(ly)+'%';
  $('puerta').style.left=dx+'%';$('puerta').style.top=Math.max(0,posY(dy)-5)+'%';
  $('puerta').style.transform=vistaReducida?'scale(1.18)':'scale(1.10)';
  $('llave').style.transform=vistaReducida?'scale(1.05)':'scale(1)';
}
function marcador() {
  $('vidas').textContent=vidas;
  $('puntos').textContent=puntos;
  $('avance').textContent=`Retos: ${indice}/${retos.length}`;
  $('nivel').textContent=(nivelActual+1)+'/'+niveles.length;
}
function cargarReto() {
  resuelto=false;
  reiniciarTiempo();
  $('pregunta').textContent=retos[indice].pregunta;
  $('respuesta').value='';
  $('respuesta').disabled=false;
  $('responder').disabled=false;
  $('continuar').hidden=true;
  $('mensaje').textContent='';
  $('respuesta').focus({preventScroll:true});
}
function iniciar() {
  if($('sinVidas').open)$('sinVidas').close();
  vidas=configuracion.vidas;puntos=0;iniciarNivel(0);
}
function iniciarNivel(n) {
  partida++;nivelActual=n;indice=0;puertaLista=false;
  const actual=niveles[n];
  // Usa tres preguntas al azar del banco de diez, como choice() en Python.
  // Puede repetirse una pregunta, igual que en el programa original.
  retos=Array.from({length:3},()=>actual.retos[Math.floor(Math.random()*actual.retos.length)]);
  // Inicio y tres avances; mantiene las posiciones diseñadas por el equipo.
  recorrido=[actual.recorrido[0],actual.recorrido[1],actual.recorrido[3],actual.recorrido[5]];
  mostrar('juego');activo=true;resuelto=false;
  $('puerta').disabled=true;$('llave').hidden=false;
  $('continuar').textContent='Siguiente reto';
  $('aldi').classList.remove('salto');
  $('fondo').hidden=true;$('fondo').onload=null;$('fondo').onerror=null;$('fondo').removeAttribute('src');
  $('escenario').classList.toggle('sin-plataformas',!!configuracion.ocultarPlataformas);
  // Un cargador propio evita que el fondo del nivel anterior aparezca por una carga tardía.
  const ruta=actual.fondo||configuracion.fondoJuego;
  if(ruta){const imagen=new Image(),sesion=partida;imagen.onload=()=>{if(partida===sesion){$('fondo').src=ruta;$('fondo').hidden=false}};imagen.src=ruta}
  $('estado').textContent=actual.nombre+': consigue la llave y llega a la puerta.';
  colocar();marcador();cargarReto();
}
function pasarPuerta(){if(puertaLista&&nivelActual<niveles.length-1)iniciarNivel(nivelActual+1)}
function completarNivel(){
  sonar('llave', 'nivel'); // Primero la llave y después la celebración, sin encimarse.
  if(nivelActual===niveles.length-1){terminar(true);return}
  activo=false;puertaLista=true;$('puerta').disabled=false;
  $('continuar').hidden=false;$('continuar').textContent='Pasar al siguiente nivel';
  $('mensaje').textContent='¡Puerta abierta! Pulsa la puerta o el botón para entrar al siguiente escenario.';
  $('estado').textContent='¡Nivel completado! Conservas tus puntos y las vidas que te quedan.';
}
function terminar(gano) {
  // Termina la música para escuchar claramente el resultado y sus efectos.
  musicaJuegoAldi.pause();
  if (!gano) sonar('incorrecto', 'reintentar');
  activo=false;puertaLista=false;$('puerta').disabled=true;
  $('respuesta').disabled=true;
  $('responder').disabled=true;
  $('continuar').hidden=true;
  $('mensaje').textContent=gano?`¡Ganaste! Aldi completó los cinco niveles. Puntos: ${puntos}.`:'Te quedaste sin vidas. ¡Vuelve a intentarlo!';
  $('estado').textContent=gano?'¡Puerta abierta! Completaste el recorrido.':'Partida terminada. Puedes reiniciar.';
  if(!gano){$('tituloSinVidas').textContent=configuracion.letreroSinVidas;$('textoSinVidas').textContent=configuracion.mensajeReintentar;if(!$('sinVidas').open)$('sinVidas').showModal()} 
}
function revisar(e) {
  e.preventDefault();
  if(!activo||resuelto)return;
  // No permite aceptar respuestas que llegaron después del límite.
  if(performance.now()>=venceEn){vidas--;marcador();$('respuesta').value='';if(vidas<=0)terminar(false);else{sonar('incorrecto');reiniciarTiempo();$('mensaje').textContent='Se acabó el tiempo. Perdiste una vida.'}return}
  const texto=$('respuesta').value.trim().replace(',','.');
  if(!texto){$('mensaje').textContent='Escribe tu respuesta.';return}
  if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(texto)){$('mensaje').textContent='Escribe solamente el resultado numérico.';return}
  const numero=Number(texto);
  if(Math.abs(numero-retos[indice].respuesta)>1e-8) {
    vidas--;$('respuesta').value='';marcador();
    $('mensaje').textContent='Respuesta incorrecta. Perdiste una vida; inténtalo otra vez.';
    if(vidas<=0)terminar(false);
    else {sonar('incorrecto');reiniciarTiempo();}
    return;
  }
  if (indice < retos.length - 1) sonar('correcto');
  resuelto=true;puntos+=configuracion.puntosPorAcierto;indice++;
  $('aldi').classList.remove('salto');void $('aldi').offsetWidth;$('aldi').classList.add('salto');
  if(indice>=3)$('llave').hidden=true;
  $('estado').textContent=indice>=3?'¡Conseguiste la llave! Sigue hasta la puerta.':'¡Aldi avanzó! Sigue resolviendo.';
  colocar();marcador();
  $('respuesta').disabled=true;$('responder').disabled=true;
  if(indice===retos.length){completarNivel();return}
  $('mensaje').textContent='¡Correcto! Aldi avanzó al paso '+indice+' de '+retos.length+'.';
  $('continuar').hidden=false;
  // La siguiente pregunta llega después del salto. El reloj se pausa durante él.
  const numeroPartida=partida, paso=indice;
  if(configuracion.avanceAutomatico) setTimeout(()=>{if(activo&&resuelto&&partida===numeroPartida&&indice===paso)cargarReto()},Math.max(700,Number(configuracion.esperaEntreRetosMs)||900));
}
function portada(){if($('sinVidas').open)$('sinVidas').close();partida++;activo=false;puertaLista=false;mostrar('portada')}
document.title='Math Arcade | Math Pixels';
$('tituloPortada').textContent=$('tituloJuego').textContent=configuracion.titulo;
$('frasePortada').textContent=configuracion.frasePortada;
$('saludo').textContent=configuracion.bienvenida;
$('autores').textContent=configuracion.autores;
$('datos').textContent=configuracion.datos;
$('descripcion').textContent=configuracion.descripcion;
for(const texto of configuracion.instrucciones){const li=document.createElement('li');li.textContent=texto;$('listaInstrucciones').append(li)}
cargarImagen('imagenPortada',configuracion.imagenPortada,null,()=>{$('portada').classList.add('con-imagen')});
cargarImagen('imagenInstrucciones',configuracion.imagenInstrucciones);
fondoBienvenida(configuracion.fondoInstrucciones);
$('fondo').style.objectFit=configuracion.ajusteFondo;
// El fondo del juego se carga cada vez que se entra en un nivel.
cargarImagen('imagenAldi',configuracion.imagenAldi,'aldiEjemplo');
cargarImagen('imagenLlave',configuracion.imagenLlave,'llaveEjemplo');
cargarImagen('imagenPuerta',configuracion.imagenPuerta,'puertaEjemplo');
$('verInstrucciones').onclick=()=>mostrar('bienvenida');
$('comenzar').onclick=$('jugarInstrucciones').onclick=$('reiniciar').onclick=iniciar;
$('volverBienvenida').onclick=$('volverJuego').onclick=portada;
$('formulario').addEventListener('submit',revisar);
$('continuar').onclick=()=>{if(puertaLista)pasarPuerta();else if(activo&&resuelto&&indice<retos.length)cargarReto()};
$('puerta').onclick=pasarPuerta;
$('reintentarSinVidas').onclick=iniciar;
$('portadaSinVidas').onclick=portada;
$('sinVidas').addEventListener('cancel',e=>{e.preventDefault();portada()});
window.addEventListener('resize',()=>{if(!$('juego').hidden)colocar()});
// NO MOVER: inicia el reloj. Se detiene al acertar, finalizar o salir.
requestAnimationFrame(reloj);
</script>
<script>
/* En celular vertical, el reto se muestra debajo del escenario sin tapar a Aldi. */
(function(){
 const panel=document.getElementById('retos');
 const escenario=document.getElementById('escenario');
 const juego=document.getElementById('juego');
 const mq=window.matchMedia('(max-width:650px) and (orientation:portrait)');
 function distribuir(){
   if(mq.matches && panel.parentElement===escenario){escenario.after(panel);}
   else if(!mq.matches && panel.parentElement!==escenario){escenario.appendChild(panel);}
 }
 distribuir();window.addEventListener('resize',distribuir);
})();
</script>
