<section class="welcome" id="welcome"><div class="welcome-card"><div class="welcome-visual"><img class="welcome-banner" src="assets/banner-sin-perfiles.webp" alt="Math Arcade, videojuegos matemáticos del Colegio Nezaldi"></div><h1>MATH ARCADE</h1><p class="school">Comunidad de Aprendizaje Nezaldi</p><p class="project">Proyecto de Tercero de Secundaria · Computación y Matemáticas</p><p class="cycle">Ciclo escolar 2026–2027</p><p class="subtitle">¡Seis juegos creados por estudiantes, infinitas maneras de aprender!</p><p class="docentes">Docentes responsables: <strong>Ana Blanco y Perla Cabello</strong></p><button class="primary" id="start">▶ COMENZAR</button></div></section>

<script>
// Los seis videojuegos de Math Arcade están integrados.
const games=[
{id:'nezaldi-fc',name:'Nezaldi FC',color:'#00bdff',file:'juegos/nezaldi-fc/index.html',desc:'Fútbol y desafíos matemáticos.'},
{id:'aldi-divisor',name:'Aldi divisor',color:'#ff981b',file:'juegos/aldi-divisor/index.html',desc:'Divisiones y operaciones con Aldi.'},
{id:'a-toda-mate',name:'A toda mate',color:'#ffe100',file:'juegos/a-toda-mate/index.html',desc:'Un recorrido matemático por el colegio.'},
{id:'pacminion',name:'Pacminion',color:'#a94dff',file:'juegos/pacminion/index.html',desc:'Aventuras, laberintos y retos.'},
{id:'mathrix',name:'Mathrix',color:'#07e2a0',file:'juegos/mathrix/index.html',desc:'Figuras geométricas y acertijos.'},
{id:'daca',name:'DACA',color:'#fa386a',file:'juegos/daca/index.html',desc:'Dos personajes, cuatro niveles cooperativos y retos matemáticos.'}
];
const el=id=>document.getElementById(id);let selected=null;let current='home';
function render(){
  const term=el('search').value.toLowerCase().trim();
  const list=games.filter(g=>(current!=='favorites'||localStorage.getItem('fav:'+g.id)==='1')&&g.name.toLowerCase().includes(term));
  el('grid').innerHTML=list.map(g=>`<div class="game"><button class="cover" style="--game-color:${g.color}" onclick="choose('${g.id}')" aria-label="Abrir ${g.name}"><img src="assets/${g.id}.webp" alt="Portada de ${g.name}"></button><span class="game-name">${g.name}</span></div>`).join('');
  el('empty').classList.toggle('hidden',list.length>0);
}

// Música de portada: intenta sonar desde la carga de la web. En iPhone y
// algunos Android se requiere el primer toque real; COMENZAR lo inicia.
const musicaArcade=el('musicaArcade');
musicaArcade.volume=0.48;
musicaArcade.preload='auto';
let audioActivadoPorVisitante=false;
function reproducirMusica(){
  if (document.hidden || !musicaArcade.paused) return;
  try {
    const intento=musicaArcade.play();
    if (intento && typeof intento.catch==='function') intento.catch(()=>{});
  } catch(e) { /* Safari puede bloquear audio hasta una interacción */ }
}
function primerToque(){
  audioActivadoPorVisitante=true;
  reproducirMusica();
}
// Al tocar cualquier punto de la portada (sin botones adicionales), empieza.
for(const nombre of ['pointerdown','touchstart','touchend','click','keydown']){
  document.addEventListener(nombre,primerToque,{capture:true,passive:true});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',reproducirMusica,{once:true});
else reproducirMusica();
window.addEventListener('load',reproducirMusica,{once:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) musicaArcade.pause();
  else if(audioActivadoPorVisitante) reproducirMusica();
});
window.addEventListener('pagehide',()=>musicaArcade.pause());
window.addEventListener('pageshow',()=>{if(audioActivadoPorVisitante)reproducirMusica()});
function showApp(){primerToque();el('welcome').classList.add('hidden');el('app').classList.remove('hidden');window.scrollTo(0,0);render()}
function abrirInformacion(){
  selected=null;
  el('modalTitle').textContent='Sobre Math Arcade';
  el('modalText').textContent='Proyecto de videojuegos matemáticos creados por estudiantes de tercero de secundaria de la Comunidad de Aprendizaje Nezaldi.\n\nDocentes responsables: Ana Blanco y Perla Cabello.';
  el('openGame').classList.add('hidden');
  el('openGame').disabled=true;
  el('modal').classList.remove('hidden');
}
function choose(id){el('openGame').classList.remove('hidden');selected=games.find(g=>g.id===id);el('modalTitle').textContent=selected.name;el('modalText').textContent=selected.desc+(selected.pending?' Próximamente: falta integrar la carpeta de DACA.':' Selecciona JUGAR para comenzar.');el('openGame').disabled=!!selected.pending;el('modal').classList.remove('hidden')}
el('start').onclick=showApp;el('heroPlay').onclick=()=>{el('grid').scrollIntoView({behavior:'smooth'})};el('close').onclick=()=>el('modal').classList.add('hidden');el('modal').onclick=e=>{if(e.target===el('modal'))el('modal').classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')el('modal').classList.add('hidden')});
el('openGame').onclick=()=>{if(!selected||selected.pending)return;musicaArcade.pause();location.href=selected.file};
el('search').oninput=render;document.querySelectorAll('[data-nav]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');current=btn.dataset.nav;if(current==='home'){el('app').classList.add('hidden');el('welcome').classList.remove('hidden');window.scrollTo(0,0);return;}if(current==='info'){abrirInformacion();current='home'}showApp();el('sectionTitle').textContent=current==='favorites'?'Favoritos':current==='search'?'Buscar juegos':'Videojuegos';el('search').classList.toggle('hidden',current!=='search');if(current==='search')el('search').focus()});
// Desde los videojuegos, el menú inferior vuelve directamente a la sección elegida.
(function abrirSeccionEnlace(){
  const view=new URLSearchParams(location.search).get('view');
  if(!view || view==='home')return;
  if(!['games','search','favorites','info'].includes(view))return;
  showApp();
  current=view==='info'?'home':view;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view));
  el('sectionTitle').textContent=view==='favorites'?'Favoritos':view==='search'?'Buscar juegos':'Videojuegos';
  el('search').classList.toggle('hidden',view!=='search');
  
  render();
  if(view==='info') abrirInformacion();
})();
render();
</script>
</body></html>
